# Compiles the RAVENNA ALSA kernel module this repository reaches.
#
# Not ours, and not a submodule of ours either: it arrives at
# external/aes67-linux-daemon/3rdparty/ravenna-alsa-lkm, inside the daemon,
# which is why the checkout below is recursive. aes67-linux-ptpd compiles one
# file out of it -- driver/PTP.c, with stubbed kernel headers -- to hold this
# project's grandmaster against what a real slave decides about a packet. That
# test says what the module DECIDES. It says nothing about whether the module
# still builds.
#
# It is worth knowing, because it has not always: a kernel that has moved on
# is the day the device this interoperates with stops existing on new
# installations. A Mac cannot tell us that. A Linux runner can, for the price
# of a compile.
#
# Compiles only. The .ko comes out built against the headers apt installed, not
# against the kernel the runner is running, so insmod would refuse it on
# version alone -- and a hosted runner would refuse to load a module in any
# case. Loading it, and everything that needs it loaded, wants a Linux machine
# with root and a matching kernel.
name: ravenna-lkm

on:
  push:
    paths:
      # The pointer this repository tracks. The module itself is a submodule
      # of the daemon, so no filter here can name it: it moves when this does.
      - 'external/aes67-linux-daemon'
      - '.github/workflows/ravenna-lkm.yml'
  pull_request:
    paths:
      # The pointer this repository tracks. The module itself is a submodule
      # of the daemon, so no filter here can name it: it moves when this does.
      - 'external/aes67-linux-daemon'
      - '.github/workflows/ravenna-lkm.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # linux-headers-generic rather than the running kernel's: a hosted
      # runner runs a cloud kernel whose headers are not always packaged, and
      # what is being asked here is whether the source still compiles.
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic

      # The module's own Makefile builds against /lib/modules/$(uname -r)/build,
      # and on a runner that names a cloud kernel whose headers are not there.
      # KSRC is the variable it puts that path in, so the path is given
      # directly: KERNELRELEASE would do it too, but kbuild reserves that name
      # for its own use inside an external module build.
      # KBUILD_MODPOST_WARN because the module calls into ALSA -- snd_card_new,
      # snd_pcm_new and the rest -- and those are exported by modules, not by
      # the kernel image. A headers package carries no symbol versions for
      # other modules, so modpost cannot resolve them and, by default, refuses
      # to emit the .ko at all. With this it says so and carries on.
      #
      # What that leaves proven: every translation unit still compiles against
      # this kernel, which is the question being asked and the one that breaks.
      # What it does not: that the symbols it calls still exist with those
      # signatures. That needs the ALSA modules' own Module.symvers, which
      # means a machine with the kernel actually installed.
      - name: Build the module
        run: |
          release="$(ls /lib/modules | sort -V | tail -1)"
          echo "Building against ${release}"
          make -C external/aes67-linux-daemon/3rdparty/ravenna-alsa-lkm/driver modules \
            KSRC="/lib/modules/${release}/build/" KBUILD_MODPOST_WARN=1

      - name: The module has to exist
        run: test -f external/aes67-linux-daemon/3rdparty/ravenna-alsa-lkm/driver/MergingRavennaALSA.ko
