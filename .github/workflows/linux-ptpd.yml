# Compiles the Linux PTP daemon on Linux.
#
# It is here because the machine this package is written on is a Mac, where
# SO_TIMESTAMPING, SIOCSHWTSTAMP and /dev/ptpN do not exist: the package builds
# its wire library and its tests there and skips the daemon, so without this
# job the half that talks to the kernel would never be compiled by anybody
# until it reached a Pi.
#
# It compiles; it does not run. A grandmaster needs a NIC with a PTP hardware
# clock and a network with slaves on it, and a runner has neither.
name: linux-ptpd

on:
  push:
    paths:
      - 'packages/aes67-linux-ptpd/**'
      - 'packages/aes67-core/**'
      - 'packages/aes67-profiles/**'
      - 'packages/t41-ptp/src/ptp/ptp-bmca.h'
      - '.github/workflows/linux-ptpd.yml'
  pull_request:
    paths:
      - 'packages/aes67-linux-ptpd/**'
      - 'packages/aes67-core/**'
      - 'packages/aes67-profiles/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # aes67-core includes <uuid/uuid.h>, which comes with the SDK on macOS
      # and is a package here.
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Configure
        run: cmake -S packages/aes67-linux-ptpd -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: The daemon has to exist on Linux
        run: test -x build/aes67-ptpd

      - name: Tests
        run: ctest --test-dir build --output-on-failure

  # The build that produces something to install. arm64 is the Pi 5's own
  # architecture, and these runners are native: no cross toolchain, no
  # emulation, and the binary that comes out is the one the board runs.
  package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Configure
        run: cmake -S packages/aes67-linux-ptpd -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build/packages

      - uses: actions/upload-artifact@v4
        with:
          name: aes67-ptpd-arm64
          path: |
            build/packages/*.deb
            build/aes67-ptpd
          if-no-files-found: error
          retention-days: 90
