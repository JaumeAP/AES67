# Compiles aes67-ravenna and aes67-core on Linux.
#
# It is here because the machine this is written on is a Mac and these two are
# the packages that have no reason to be: no Apple framework, no Objective-C++,
# nothing but POSIX sockets and the standard library. A package that only ever
# meets one compiler is a package whose portability is a claim rather than a
# fact, and aes67-core's platform-free contract is exactly such a claim.
#
# It compiles and runs the tests. The loopback checks the package's own gate
# does are in there too: a runner has a loopback.
name: ravenna

on:
  push:
    paths:
      - 'packages/aes67-ravenna/**'
      - 'packages/aes67-core/**'
      - 'packages/aes67-profiles/**'
      - '.github/workflows/ravenna.yml'
  pull_request:
    paths:
      - 'packages/aes67-ravenna/**'
      - 'packages/aes67-core/**'
      - 'packages/aes67-profiles/**'
      - '.github/workflows/ravenna.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # doctest is a submodule of this repository and every suite includes it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # aes67-core includes <uuid/uuid.h>, which comes with the SDK on macOS
      # and is a package here.
      # uuid-dev for aes67-core's <uuid/uuid.h>; the rest is the analysis
      # half of each gate, which AES67_ANALYSE=1 below turns on.
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev clang-tidy cppcheck clang

      # The packages' own gates, not a second description of them here.
      - name: aes67-profiles
        env:
          AES67_ANALYSE: '1'
        run: packages/aes67-profiles/scripts/gate.sh

      - name: aes67-core
        env:
          AES67_ANALYSE: '1'
        run: packages/aes67-core/scripts/gate.sh

      - name: aes67-ravenna
        env:
          AES67_ANALYSE: '1'
        run: packages/aes67-ravenna/scripts/gate.sh

      # The coverage-guided fuzzers, which the gates cannot build on the Mac
      # this is written on: Apple's clang ships no libFuzzer runtime.
      - name: Fuzz the parsers, guided
        run: |
          cmake -S packages/aes67-ravenna -B build-fuzz -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ -DAES67_LIBFUZZER=ON -DAES67_SANITIZE=address,undefined
          cmake --build build-fuzz -j
          build-fuzz/FuzzRavennaParsers -max_total_time=60 -max_len=4096 -print_final_stats=1
          # aes67-core is a subdirectory of this build, so its target lands
          # under that subdirectory's binary dir and not at the top. It was
          # written as if it were top-level, and the step exited 127 -- after
          # the ravenna fuzzer had already run its minute, which is why the
          # failure looked like a fuzzing failure and was a path.
          build-fuzz/aes67-core/FuzzCoreParsers -max_total_time=60 -max_len=8192 -print_final_stats=1
