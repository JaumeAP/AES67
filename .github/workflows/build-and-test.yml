name: Build and Test

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    strategy:
      matrix:
        build-type: [Debug, Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          echo "Installing cmake..."
          brew install cmake
          echo "Dependencies installed (libASPL will be used from submodule)"

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        working-directory: build
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF

      - name: Build
        working-directory: build
        run: make -j$(sysctl -n hw.logicalcpu)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Check for warnings
        working-directory: build
        run: |
          if make 2>&1 | grep -i "warning" | grep -v "^--"; then
            echo "Build completed with warnings"
            exit 0
          fi

  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for TODO/FIXME
        run: |
          echo "=== Active TODOs ==="
          grep -rn "TODO" --include="*.cpp" --include="*.h" --include="*.hpp" --include="*.swift" . \
            | grep -v vendor | grep -v ".git" || echo "No TODOs found"

      - name: Verify no dead code inclusions
        run: |
          echo "=== Checking for dead code references ==="
          grep -rn "CircularJitterBuffer\|JitterBuffer\|TemporalJitterBuffer\|SimplifiedLockFreePacketPool" \
            CMakeLists.txt Tests/CMakeLists.txt || echo "No dead code references found"
