# Compiles the Teensy package: its host tests, and the board build.
#
# The package is a submodule now -- JaumeAP/t41-ptp -- so the paths below
# match only when this repository's pointer to it moves, which is exactly when
# this tree's copy of it changes. Work done inside that repository is that
# repository's to check. The host
# tests run on any machine, so `.githooks/pre-push` covers them; the board
# build wants PlatformIO and a Teensy toolchain the machine this is written on
# does not carry, which is what this job is for.
#
# It compiles; nothing runs on hardware. There is no Teensy on a runner.
name: t41-ptp

on:
  push:
    paths:
      - 'packages/t41-ptp/**'
      - '.github/workflows/t41-ptp.yml'
  pull_request:
    paths:
      - 'packages/t41-ptp/**'
      - '.github/workflows/t41-ptp.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # QNEthernet and Time are submodules of this repository and the board
      # build links against both. Without them PlatformIO resolves the
      # symlinked libraries to empty directories and fails at the first
      # #include.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The toolchain is hundreds of megabytes and does not change between
      # runs; the key follows platformio.ini, which is what chooses it.
      - name: Cache the PlatformIO toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('packages/t41-ptp/ci/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: PlatformIO
        run: pip install platformio

      # clang-tidy for the analysis half of the gate. The Mac this is written
      # on had none for a long time, and the target it would have run was
      # macOS-only anyway, so nothing had ever analysed this package.
      - name: clang-tidy and cppcheck
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck clang

      # The package's own gate, not a second description of it here: host
      # tests with -Werror, clang-tidy, cppcheck, the same tests under ASan
      # and UBSan, the deterministic fuzz run, then the Teensy 4.1 build.
      - name: Gate
        env:
          AES67_ANALYSE: '1'
        run: packages/t41-ptp/scripts/gate.sh --board

      # The coverage-guided fuzzer, which the gate cannot run on the Mac this
      # is written on: Apple's clang ships no libFuzzer runtime. A minute of
      # it per run, from a corpus that does not persist between runs -- what
      # this catches is a parser that a mutation can walk into, not a deep
      # state machine bug, and a minute is what that is worth.
      - name: Fuzz the parser, guided
        run: make -C packages/t41-ptp/test fuzz-libfuzzer FUZZ_TIME=60 CXX=clang++

      # Line coverage of src/ptp, printed rather than enforced. A threshold
      # nobody chose is a number people learn to ignore.
      - name: Coverage
        run: make -C packages/t41-ptp/test coverage
