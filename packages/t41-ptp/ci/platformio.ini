; Builds the example for the board, so that a change that only compiles
; on the host cannot pass unnoticed. The sketch under src/ is written
; from examples/PTPNode by the caller, not kept here.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    symlink://${PROJECT_DIR}/..
    symlink://${PROJECT_DIR}/../libraries/QNEthernet
    symlink://${PROJECT_DIR}/../libraries/Time
lib_ldf_mode = deep+
build_flags =
    ; The framework's own headers as system headers: the library is built
    ; with -Wconversion (see library.json) and the Arduino core's pin
    ; macros produce a hundred warnings of their own inside our
    ; translation units, which would bury ours.
    -isystem ${platformio.packages_dir}/framework-arduinoteensy/cores/teensy4
    -I${PROJECT_DIR}/../libraries/QNEthernet/src
    -I${PROJECT_DIR}/../libraries/Time
    -I${PROJECT_DIR}/../src
    ; The profiles package: tables both this firmware and the macOS driver
    ; read, so neither carries a copy. Freestanding headers, nothing linked.
    -I${PROJECT_DIR}/../../aes67-profiles
