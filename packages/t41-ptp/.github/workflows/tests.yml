name: tests

on:
  push:
    branches: [main]
  pull_request:

# A branch pushed twice in a minute does not need both builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        # Warnings fail here. One that only shows up on another compiler
        # should stop the build rather than be argued about later. The
        # Makefile already asks for -Wconversion and -Wsign-conversion:
        # the board's long is 32 bits and this machine's is 64, so a
        # narrowing that only bites on the Teensy is caught here.
        run: make -C test EXTRA_CXXFLAGS=-Werror

  board-build:
    name: build the example for the Teensy 4.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-teensy-${{ hashFiles('ci/platformio.ini') }}
          restore-keys: platformio-teensy-
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build the example
        # The same target a contributor runs, so that the recipe --
        # writing ci/src/main.cpp with the prototypes an .ino gets from
        # the Arduino preprocessor and a .cpp does not -- lives in one
        # place and cannot drift from what CI actually builds.
        run: make -C test board
