; AES67-MasterBox -- PTP grandmaster on a Teensy 4.1 (NXP i.MX RT1062)
;
; The library lives in lib/ as a git submodule (see HARDWARE.md).
; PlatformIO finds it automatically: lib/ is its default lib_dir.
;
;   t41-ptp -> JaumeAP/t41-ptp, branch main: the audited fork, which carries
;   the fixes of four audits, the servo split out into ptp-servo.h so it can
;   be run on a host, and T41PTP_LOGGING_LEVEL. It used to be
;   integration/master-box; that branch is the upstream original plus two
;   changes of ours, and its PTPBase has none of the accessors the audio and
;   NMOS modules here call.
;
; QNEthernet no longer hangs off this repository: it is now a submodule of
; t41-ptp, which is what includes it, and lives at
; lib/t41-ptp/libraries/QNEthernet -> JaumeAP/QNEthernet, branch
; multicast-ttl.
;
; Details of both in HARDWARE.md.
;
; https://docs.platformio.org/page/projectconf.html

; The split: the submodule is IEEE 1588 and nothing else, and everything that
; is application lives in this repository's src/, which is what gets compiled
; -- the announced profile, the word clock divider, the state shared with the
; ISRs, and everything that carries or describes a stream: src/audio, the
; AES67 tone sender with its RTP path and its SDP, and src/nmos, the IS-04
; registration. HANDOFF.md sets that boundary out; test/ runs both on a host.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; The default lib_dir does not descend into the libraries it finds, so the
; QNEthernet that t41-ptp carries inside would go unseen. This line makes it
; visible.
lib_extra_dirs = lib/t41-ptp/libraries

; -Wall: the PTP library touches registers directly, its warnings are worth
; seeing.
;
; T41PTP_LOGGING_LEVEL: the library's serial chatter. 0 silent, 1 the normal
; messages, 2 and above the detail of every message. It goes through a build
; flag and not a call because, decided at run time, the switched-off
; Serial.printf calls stay inside the binary: some 1.5 KB of flash and 1 KB of
; RAM for nothing.
build_flags =
  -Wall
  ; The library is built with -Wconversion, -Wsign-conversion and -Werror
  ; (its library.json asks for them), and the Teensy core's own headers --
  ; elapsedMillis.h among them -- produce sign conversions of their own
  ; inside every translation unit that includes them. As system headers
  ; their warnings are not ours to fail on, which is what this does; the
  ; library's own CI passes the same flag for the same reason.
  -isystem ${platformio.packages_dir}/framework-arduinoteensy/cores/teensy4
  -DT41PTP_LOGGING_LEVEL=0

monitor_speed = 2000000
